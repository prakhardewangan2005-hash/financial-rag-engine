services:
  - type: web
    name: financial-rag-engine
    env: python
    buildCommand: pip install -r requirements.txt && python3 scripts/ingest_data.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: CACHE_ENABLED
        value: "true"
